  <h1>繁體對照</h1>
  <p class="note" lang="en">Traditional Chinese. Language is zh-TW. Watch 說, 體, 龍, and 為.</p>
  <p>他說這不是一本普通的書。書中寫一條龍的形體，鱗甲分明。</p>
  <p>讀者為此一讀再讀。國學、書體、與舊時傳說同頁而列。</p>
  <p>開門見山之後，問聞後事，從無到有，於燈下翻頁。</p>
  <p>這一段刻意使用繁體字形：說、體、龍、為、國、學、與、這、個、來、時、會、過、還、對、開、關、門、問、聞、後、從、無、於。</p>
</body>
