        ranges: *cjk_fallback_ranges
      - path: builtinFonts/source/NotoSansCJKsc/NotoSansCJKsc-Regular.otf
        ranges: *cjk_fallback_ranges
    extra_fallbacks_bold:
      - url: "https://github.com/lxgw/LxgwWenKai/releases/download/v1.522/LXGWWenKai-Medium.ttf"
        ranges: *cjk_fallback_ranges
      - path: builtinFonts/source/NotoSansCJKsc/NotoSansCJKsc-Regular.otf
