<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN" xml:lang="zh-CN">
<head>
  <title>中英混排</title>
  <link rel="stylesheet" type="text/css" href="styles/test.css"/>
</head>
<body>
  <h1>中英混排</h1>
  <p class="note" lang="en">Spaces around English words must remain.</p>
  <p class="mixed">请在设置里选择 CrossInk 阅读器字体，并指定 LXGW WenKai。</p>
  <p class="mixed">产品名 OpenType 与 TrueType 必须带空格写入中文句子。</p>
  <p class="mixed">句中插入 English words like "firmware" 与 "Xteink X4" 后，空格仍须可见。</p>
  <p class="mixed">路径示例：把 test_chinese.epub 拷到 /.fonts/ 之外的书籍目录。</p>
</body>
</html>
