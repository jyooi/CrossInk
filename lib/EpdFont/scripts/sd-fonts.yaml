  # -- CJK (not in the default download catalog) --------------------------
  #
  # Built by build-cjk-fonts.py. Regular + Medium (used as bold). Sizes
  # 8/10/12/14 only. These families are large (tens of MB each) and are
  # omitted from the default release-fonts workflow.
  #
  # Every CJK extra fallback is restricted to the CJK blocks it is meant to
  # fill. Without ranges these faces would also claim the Cyrillic, lambda,
  # music-note and emoji codepoints that patched_intervals adds to every
  # family, and ChareInk7 / NotoSymbols / NotoSans-Regular would never be
  # reached. The ranges below cover the "cjk", "bopomofo" and "cjk-ext-a"
  # presets of fontconvert_sdcard.py.

  - name: LXGWWenKai
    description: "Kai for Simplified Chinese books"
    languages: "Simplified Chinese, Latin"
    intervals: cjk,punctuation,bopomofo,cjk-ext-a
    sizes: [8, 10, 12, 14]
    optional: true
    extra_fallbacks:
      - path: builtinFonts/source/NotoSansCJKsc/NotoSansCJKsc-Regular.otf
        ranges: &cjk_fallback_ranges
          - "0x3000-0x303F"
          - "0x3040-0x309F"
          - "0x30A0-0x30FF"
          - "0x3100-0x312F"
          - "0x3400-0x4DBF"
          - "0x4E00-0x9FFF"
          - "0xF900-0xFAFF"
          - "0xFF00-0xFFEF"
    styles:
      regular:
        { url: "https://github.com/lxgw/LxgwWenKai/releases/download/v1.522/LXGWWenKai-Regular.ttf" }
      bold:
        { url: "https://github.com/lxgw/LxgwWenKai/releases/download/v1.522/LXGWWenKai-Medium.ttf" }

  - name: LXGWWenKaiTC
    description: "Kai for Traditional Chinese books"
    languages: "Traditional Chinese, Latin"
