<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN" xml:lang="zh-CN">
<head>
  <title>注音与拼音</title>
  <link rel="stylesheet" type="text/css" href="styles/test.css"/>
</head>
<body>
  <h1>注音与拼音</h1>
  <p class="note" lang="en">Ruby uses rt for Bopomofo and pinyin.</p>
  <p><ruby>汉<rt>ㄏㄢˋ</rt></ruby><ruby>字<rt>ㄗˋ</rt></ruby><ruby>注<rt>ㄓㄨˋ</rt></ruby><ruby>音<rt>ㄧㄣ</rt></ruby>。</p>
  <p><ruby>汉<rt>hàn</rt></ruby><ruby>字<rt>zì</rt></ruby><ruby>拼<rt>pīn</rt></ruby><ruby>音<rt>yīn</rt></ruby>。</p>
  <p><ruby>臺<rt>ㄊㄞˊ</rt></ruby><ruby>灣<rt>ㄨㄢ</rt></ruby>与<ruby>北<rt>běi</rt></ruby><ruby>京<rt>jīng</rt></ruby>同页。</p>
</body>
</html>
