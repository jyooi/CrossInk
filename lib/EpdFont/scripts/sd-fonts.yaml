# SD Card Font Families for CrossPoint Reader
#
# This file is the single source of truth for which fonts are generated,
# how they're sourced, and how they're described in the download manifest.
#
# Adding a new font family = adding a block here. No code changes needed.
#
# Fields:
#   name:        Output family name (used in filenames and on-device UI)
#   description: Human-readable description (shown in download UI and manifest)
#   languages:   Human-readable supported scripts/languages (shown as a separate UI line)
#   intervals:   Comma-separated extra Unicode interval presets for fontconvert_sdcard.py.
#                build-sd-fonts.py always adds the "builtin" preset so SD fonts
#                request the same core ranges as built-in reader fonts.
#   sizes:       Point sizes to generate
#   force_autohint: (optional) Force FreeType auto-hinter instead of native hinting
#   optional:    (optional) true keeps the family out of the default build.
#                Only an explicit --only <name> builds it. Use for very large
#                families (CJK) that the release-fonts workflow must not fetch.
#   styles:      Map of style name -> font source
#                  path: relative to lib/EpdFont (for committed fonts)
#                  url:  download URL (for fonts not in the repo)
#
# Extra fallback faces:
#   extra_fallbacks: (optional) List of fallback font specs tried BEFORE the
#                built-in fallback stack, in listed order. Each entry uses
#                exactly one of 'path' (relative to lib/EpdFont) or 'url',
#                plus an optional 'ranges' list.
#   extra_fallbacks_<style>: (optional) Per-style override, for example
#                extra_fallbacks_bold. When present for a style it REPLACES
#                extra_fallbacks for that style; the two do not merge. Repeat
#                any shared entries you still want.
#   ranges:      (optional) Restricts one fallback face to the listed codepoint
#                ranges. Each item is an inclusive "0xSTART-0xEND" string, for
#                example ["0x4E00-0x9FFF", "0x3400-0x4DBF"]. Omit it to let the
#                face cover every missing codepoint.
#
# Variable fonts:
#   Some fonts (Bitter, Inter, Alegreya) are distributed as variable fonts.
#   freetype-py can't set variable font axis values, so the build script
#   uses fonttools.instancer to extract static instances automatically.
#
#   To use a variable font, add a 'variable' key to the style spec with
#   axis values to pin:
#
#     styles:
#       regular: {url: "https://...Font[wght].ttf", variable: {wght: 400}}
#       bold:    {url: "https://...Font[wght].ttf", variable: {wght: 700}}
#
#   Extracted static fonts are cached in instanced_fonts/ (gitignored).
#   Requires fonttools: pip install -r requirements.txt

